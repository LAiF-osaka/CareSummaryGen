[project]
name = "caresummarygen"
version = "2.0.0"
description = "医療記録から看護サマリーを自動生成するツール（LangGraph + Ollama SDK + FastAPI）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- オーケストレーション ---
    "langgraph>=1.1.0",
    # --- LLM ---
    "ollama>=0.6.0",
    # --- Web ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # --- データ処理 ---
    "tiktoken>=0.8.0",
    "pydantic>=2.7.4",
    "pyyaml>=6.0",
    # --- DB取得（query_spec 経由の汎用RDBアクセス） ---
    "sqlalchemy>=2.0.0",
    # --- 環境変数 ---
    "python-dotenv>=1.0.0",
    # --- 前処理（既存） ---
    "chardet>=5.0.0",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "flake8>=7.1.1",
    "isort>=5.13.2",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
